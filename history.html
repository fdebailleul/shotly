<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Shotly - Historique</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9V5a2 2 0 012-2h4"/>
        <path d="M15 3h4a2 2 0 012 2v4"/>
        <path d="M21 15v4a2 2 0 01-2 2h-4"/>
        <path d="M9 21H5a2 2 0 01-2-2v-4"/>
        <circle cx="12" cy="12" r="3" fill="#6366f1" opacity="0.2" stroke="#6366f1"/>
      </svg>
      <span class="brand">SHOTLY</span>
      <span class="brand-dot"></span>
      <span class="page-title">Historique</span>
    </div>
    <div class="topbar-right">
      <span class="count-badge" id="count-badge">0 captures</span>
      <div class="topbar-sep"></div>
      <!-- Selection toolbar (hidden by default) -->
      <div class="selection-bar" id="selection-bar" style="display:none">
        <span class="selection-count" id="selection-count">0 sélectionnées</span>
        <button class="toolbar-btn" id="btn-open-selected" title="Ouvrir dans l'éditeur">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Ouvrir
        </button>
        <button class="toolbar-btn danger" id="btn-delete-selected" title="Supprimer">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
          Supprimer
        </button>
        <button class="toolbar-btn" id="btn-deselect" title="Tout désélectionner">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <button class="toolbar-btn danger" id="btn-clear-all" title="Tout effacer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        Tout effacer
      </button>
    </div>
  </header>

  <main class="content">
    <!-- Empty state -->
    <div class="empty-state" id="empty-state" style="display:none">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4d4d4" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <p>Aucune capture pour l'instant</p>
      <span>Vos captures apparaîtront ici automatiquement</span>
    </div>

    <!-- Grid of captures -->
    <div class="capture-grid" id="capture-grid"></div>
  </main>

  <script src="db.js"></script>
  <script src="history.js"></script>
</body>
</html>
