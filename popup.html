<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Ambient Background Glow -->
  <div class="ambient-glow"></div>

  <div class="popup">

    <!-- ── Top Section ─────────────────────────────────────────── -->
    <div class="top-section">

      <!-- Header -->
      <header class="header">
        <h1 class="header-title">SHOTLY</h1>
        <div class="header-dot"></div>
      </header>

      <!-- Hero Cards: 2 main modes -->
      <div class="hero-grid">
        <button class="hero-card primary" data-action="capture-visible">
          <div class="hero-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="14" rx="2"/>
              <rect x="5" y="5" width="14" height="5" rx="1" fill="currentColor" opacity="0.25"/>
              <line x1="5" y1="14" x2="19" y2="14" opacity="0.3"/>
            </svg>
          </div>
          <div class="hero-info">
            <span class="hero-title" data-i18n="captureVisible">Zone visible</span>
            <kbd class="kbd">Alt+Shift+V</kbd>
          </div>
        </button>

        <button class="hero-card" data-action="capture-area">
          <div class="hero-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="14" rx="2"/>
              <rect x="8" y="6" width="10" height="8" rx="1" stroke-dasharray="3 2" opacity="0.7"/>
              <path d="M15 11l3 3" opacity="0.5"/>
            </svg>
          </div>
          <div class="hero-info">
            <span class="hero-title" data-i18n="captureArea">Zone selectionnee</span>
            <kbd class="kbd">Alt+Shift+A</kbd>
          </div>
        </button>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- ── Bottom Section: List actions ─────────────────────────── -->
    <div class="bottom-section">
      <div class="action-list">

        <!-- Full page -->
        <button class="action-item" data-action="capture-full">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="1" width="14" height="22" rx="2"/>
              <rect x="7" y="3" width="10" height="4" rx="1" fill="currentColor" opacity="0.15"/>
              <line x1="7" y1="10" x2="17" y2="10" opacity="0.3"/>
              <line x1="7" y1="13" x2="17" y2="13" opacity="0.3"/>
              <line x1="7" y1="16" x2="13" y2="16" opacity="0.3"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="captureFull">Page entiere</span>
          <kbd class="action-kbd">Alt+Shift+F</kbd>
        </button>

        <!-- Delayed capture -->
        <div class="action-item">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="captureDelay">Capture differee</span>
          <div class="delay-chips">
            <button class="delay-chip" data-delay="3">3s</button>
            <button class="delay-chip" data-delay="5">5s</button>
            <button class="delay-chip" data-delay="10">10s</button>
          </div>
        </div>

        <!-- Screen / Window / Tab -->
        <button class="action-item" data-action="capture-screen">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="captureDesktop">Ecran & Fenetre</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <!-- Open / annotate image -->
        <button class="action-item" data-action="open-image">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
          </div>
          <span class="action-label" data-i18n="openImage">Annoter image locale</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- ── History Section ────────────────────────────────────────── -->
    <div class="bottom-section history-section">
      <div class="action-list">
        <!-- Last capture -->
        <button class="action-item" id="btn-last-capture" data-action="reopen-last" style="display:none">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 105.64-9H1"/>
            </svg>
          </div>
          <span class="action-label">Derniere capture</span>
          <img id="last-capture-thumb" class="last-thumb" src="" alt="">
        </button>

        <!-- History page -->
        <button class="action-item" data-action="open-history">
          <div class="action-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <span class="action-label">Historique</span>
          <span class="history-badge" id="history-badge" style="display:none">0</span>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" style="display:none">
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
